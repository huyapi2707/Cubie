name: Deploy VoiceWorker

on:
  push:
    branches: [main]
    paths:
      - 'VoiceWorker/**'

concurrency:
  group: deploy-voice-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.REMOTE_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts

      - name: Run deploy script
        run: |
          ssh ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} << EOF
            cd ~/apps/Cubie/VoiceWorker
            bash ./infrastructure/deploy.sh
          EOF